<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SUNSET">
<meta name="theme-color" content="#2a1a08">
<title>SUNSET — Richarh Rojas</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'DM Sans',sans-serif;background:#f5f0e8;min-height:100vh;overflow-x:hidden;color:#2a1f0e;}
:root{
  --bg:#f5f0e8;--surface:#fff;--surface2:#fdf8f0;
  --border:#e8dcc8;--border2:#d4c4a8;
  --txt:#2a1f0e;--txt2:#6b5a3e;--txt3:#9a8a6e;
  --acc:#c8780a;--acc-bg:rgba(200,120,10,0.08);
  --sun-red:#c0391b;--sun-orange:#e05a1a;--sun-amber:#e8881a;
  --sun-gold:#c8900a;--green:#1a7028;--red:#b02010;
}
.app{min-height:100vh;background:var(--bg);display:flex;flex-direction:column;}

/* HEADER */
.header{background:linear-gradient(135deg,#2a1a08,#1a0e04);padding:12px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 2px 16px rgba(0,0,0,0.2);}
.logo-wrap{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.logo-sun{width:50px;height:50px;border-radius:50%;flex-shrink:0;overflow:hidden;background:conic-gradient(from 185deg at 50% 58%,#b02a10 0deg,#c83818 30deg,#e05020 60deg,#e87018 90deg,#d49020 130deg,#ecc840 165deg,#d49020 195deg,#e87018 230deg,#e05020 270deg,#c83818 310deg,#b02a10 360deg);box-shadow:0 0 0 2px rgba(236,200,64,0.7),0 0 16px rgba(224,80,32,0.8);position:relative;}
.logo-stripes{position:absolute;bottom:0;left:0;right:0;height:40%;display:flex;flex-direction:column;}
.logo-stripes span{flex:1;background:#060402;}
.logo-stripes span:nth-child(1){opacity:.75;}.logo-stripes span:nth-child(2){opacity:.58;}.logo-stripes span:nth-child(3){opacity:.38;}.logo-stripes span:nth-child(4){opacity:.18;}
.logo-tree{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:86%;z-index:2;}
.logo-sun::after{content:'';position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(236,200,64,0.45);}
.logo-text{line-height:1;}
.logo-wordmark{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;color:#fff;}
.logo-slogan{font-size:8px;letter-spacing:2.5px;text-transform:uppercase;color:#e8a848;font-weight:500;margin-top:3px;}
.date-block{text-align:right;flex-shrink:0;}
.date-full{font-size:clamp(9px,1.6vw,13px);font-weight:600;color:#f0e8d0;letter-spacing:1.2px;text-transform:uppercase;}
.date-cycle{font-size:9px;color:#e8a848;letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;}
.date-mode{font-size:8.5px;color:rgba(255,255,255,0.4);margin-top:2px;}

/* WEEK NAV */
.week-nav{background:#2a1a08;border-top:1px solid rgba(255,255,255,0.08);padding:7px 14px;display:flex;align-items:center;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.week-nav::-webkit-scrollbar{height:2px;}.week-nav::-webkit-scrollbar-thumb{background:#e8a848;border-radius:1px;}
.wn-label{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.35);white-space:nowrap;flex-shrink:0;}
.wn-pills{display:flex;gap:4px;}
.wn-pill{padding:4px 9px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);background:transparent;font-size:9px;font-weight:500;color:rgba(255,255,255,0.4);cursor:pointer;transition:all .18s;white-space:nowrap;flex-shrink:0;}
.wn-pill:hover{border-color:rgba(232,168,72,0.4);color:rgba(255,255,255,0.75);}
/* Viewing week - strong highlight */
.wn-pill.wn-active{background:rgba(232,168,72,0.25);border-color:#e8a848;color:#e8a848;font-weight:700;}
/* Today's week - subtle dot indicator only, no strong border */
.wn-pill.wn-today{color:rgba(255,140,100,0.7);border-color:rgba(224,80,32,0.3);}
/* Today's week AND viewing - full orange */
.wn-pill.wn-today.wn-active{background:rgba(232,168,72,0.25);border-color:#e8a848;color:#e8a848;}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tool-btn{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--txt2);font-size:10px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0;}
.tool-btn:hover{border-color:var(--border2);color:var(--txt);}
.tool-btn-active{background:#fff8ee;border-color:var(--sun-amber);color:var(--sun-orange);}
.tool-spacer{flex:1;}

/* DAYS */
.days-section{background:var(--surface);border-bottom:1px solid var(--border);padding:9px 14px 9px;}
.days-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.day-pill{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px 5px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;transition:all .2s;}
.day-pill:hover{border-color:var(--border2);background:#faf4e8;}
.day-pill.today{border-color:var(--sun-amber);background:#fff8ee;box-shadow:0 0 0 2px rgba(232,136,26,0.12);}
.day-pill.plan-day{border-style:dashed;}.day-pill.plan-day.today{border-style:solid;}
.pill-name{font-size:7px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt3);}
.day-pill.today .pill-name{color:var(--sun-amber);}
.pill-num{font-size:14px;font-weight:700;color:var(--txt);line-height:1.1;}
.day-pill.today .pill-num{color:var(--sun-orange);}
.pill-mon{font-size:6.5px;color:var(--txt3);}
.pill-tag{font-size:7.5px;color:var(--txt3);margin-top:1px;}
.day-pill.today .pill-tag{color:var(--sun-amber);}
.pill-dot{width:4px;height:4px;border-radius:50%;background:var(--sun-amber);margin-top:2px;opacity:0;}
.pill-dot.has{opacity:.8;}

/* INFO BAND */
.info-band{padding:7px 14px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;min-height:34px;}
.ib-label{font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt3);flex-shrink:0;white-space:nowrap;}
.ib-content{font-size:11.5px;color:var(--txt2);font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ib-chips{display:flex;gap:5px;flex:1;overflow-x:auto;}
.ib-chip{padding:2px 8px;border-radius:20px;background:#fff8ee;border:1px solid var(--sun-amber);font-size:9px;font-weight:700;color:var(--sun-orange);white-space:nowrap;flex-shrink:0;}
.ib-maestria{display:flex;gap:14px;flex:1;}
.ib-m-item{display:flex;flex-direction:column;gap:1px;}
.ib-m-label{font-size:7px;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);font-weight:600;}
.ib-m-value{font-size:11px;font-weight:700;color:#8a6000;}

/* DIMS */
.dims-section{padding:9px 14px 0;background:var(--bg);}
.dims-label{font-size:7.5px;letter-spacing:3px;text-transform:uppercase;color:var(--txt3);margin-bottom:6px;}
.dims-row{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;}
@media(max-width:480px){.dims-row{grid-template-columns:repeat(4,1fr);}}
.dim-card{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 7px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:all .2s;}
.dim-card:hover{border-color:var(--border2);background:#faf4e8;}
.dim-card.active{border-color:var(--sun-amber);background:#fff8ee;box-shadow:0 2px 10px rgba(232,136,26,0.15);}
.dim-card.maestria-card{border-color:rgba(180,140,0,0.3);background:#fffbee;}
.dim-card.maestria-card.active{border-color:#c8a000;background:#fffde8;}
.dim-svg{width:32px;height:32px;display:flex;align-items:center;justify-content:center;}
.dim-svg svg{width:30px;height:30px;stroke:var(--txt3);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;transition:all .2s;}
.dim-card:hover .dim-svg svg,.dim-card.active .dim-svg svg{stroke:var(--sun-orange);}
.dim-card.maestria-card .dim-svg svg{stroke:#a08000;}
.dim-card.maestria-card.active .dim-svg svg{stroke:#c8a000;}
.dim-name{font-size:7px;letter-spacing:.6px;text-transform:uppercase;color:var(--txt3);text-align:center;line-height:1.3;transition:color .2s;}
.dim-card:hover .dim-name,.dim-card.active .dim-name{color:var(--sun-orange);font-weight:600;}
.dim-card.maestria-card .dim-name{color:#a08000;}
.dim-card.maestria-card.active .dim-name{color:#c8a000;font-weight:600;}

/* DETAIL PANEL */
.detail-panel{margin:8px 14px 8px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:0 2px 14px rgba(0,0,0,0.06);display:none;}
.detail-panel.open{display:block;animation:slideDown .2s ease;}
@keyframes slideDown{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.detail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.detail-dim-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--txt);}
.detail-sub{font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);margin-top:3px;}
.detail-close{width:27px;height:27px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--txt3);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.detail-close:hover{background:var(--border);color:var(--txt);}

/* PLAN SECTION */
.plan-section{display:flex;flex-direction:column;gap:9px;max-height:62vh;overflow-y:auto;padding-right:2px;}
.plan-section::-webkit-scrollbar{width:3px;}.plan-section::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.plan-block{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.plan-block-title{font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);margin-bottom:8px;font-weight:700;}
.plan-textarea{width:100%;background:#fff;border:1px solid var(--border);border-radius:8px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 11px;resize:none;outline:none;transition:border-color .2s;line-height:1.65;}
.plan-textarea:focus{border-color:var(--sun-amber);}
.plan-textarea::placeholder{color:var(--txt3);}
.plan-input{width:100%;background:#fff;border:1px solid var(--border);border-radius:8px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 11px;outline:none;transition:border-color .2s;}
.plan-input:focus{border-color:var(--sun-amber);}
.plan-input::placeholder{color:var(--txt3);}

/* PRIORITY WORDS */
.priority-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
.priority-btn{padding:7px 4px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--txt2);font-size:8.5px;text-align:center;cursor:pointer;transition:all .2s;line-height:1.4;font-weight:500;}
.priority-btn:hover{border-color:var(--border2);}
.priority-btn.sel{background:#fff8ee;border-color:var(--sun-amber);color:var(--sun-orange);font-weight:700;}

/* @ PREP */
.at-prep-grid{display:flex;flex-direction:column;gap:9px;}
.at-prep-item{display:flex;flex-direction:column;gap:4px;}
.at-prep-header{display:flex;align-items:center;gap:8px;}
.at-prep-day{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt3);min-width:30px;}
.at-prep-tag{font-size:10px;font-weight:700;color:var(--acc);}
.at-prep-note{font-size:9.5px;color:var(--txt3);line-height:1.4;padding:4px 8px;background:var(--bg);border-radius:6px;border-left:2px solid var(--sun-amber);}

/* DAILY VIEW */
.daily-view{display:flex;flex-direction:column;gap:9px;}
.at-card{padding:14px 16px;border-radius:11px;border:2px solid var(--sun-amber);background:linear-gradient(135deg,#fff8ee,#fffdf5);box-shadow:0 2px 10px rgba(232,136,26,0.08);}
.at-card-tag{font-size:9.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--sun-orange);margin-bottom:7px;}
.at-card-text{font-size:14px;color:var(--txt);line-height:1.7;font-weight:400;}
.at-card-empty{font-size:12px;color:var(--txt3);}
.prio-display{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:2px;}
.prio-chip{padding:3px 10px;border-radius:20px;background:#fff8ee;border:1px solid var(--sun-amber);font-size:9px;color:var(--sun-orange);font-weight:700;}
.daily-note-label{font-size:8.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--txt3);margin-bottom:5px;}
.daily-note-area{width:100%;background:#fff;border:1px solid var(--border);border-radius:9px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:13px;padding:10px 11px;resize:none;outline:none;transition:border-color .2s;line-height:1.65;}
.daily-note-area:focus{border-color:var(--sun-amber);}
.daily-note-area::placeholder{color:var(--txt3);}

/* SATURDAY */
.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:5px;}
.score-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 5px;text-align:center;}
.score-name{font-size:7px;color:var(--txt3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px;line-height:1.3;font-weight:500;}
.score-val{font-size:15px;font-weight:700;}
.maestria-winner-card{display:flex;align-items:center;gap:11px;padding:11px 14px;background:#fffbee;border:2px solid rgba(200,160,0,0.4);border-radius:10px;margin-bottom:8px;}
.mw-crown{font-size:20px;}
.mw-word{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:#8a6000;}
.mw-dim{font-size:9.5px;color:#a08000;margin-top:2px;font-weight:500;}
.confirm-btn{width:100%;padding:10px;border:none;border-radius:9px;background:linear-gradient(135deg,#c8a000,#8a6000);color:#fff;font-weight:700;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:opacity .2s;margin-top:6px;}
.confirm-btn:hover{opacity:.85;}

/* SAT WEEK NAV */
.sat-nav-wrap{margin-bottom:10px;}
.sat-nav-toggle{width:100%;padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--txt2);font-size:10px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
.sat-nav-scroll{display:none;overflow-x:auto;padding:7px 0 3px;gap:4px;-webkit-overflow-scrolling:touch;}
.pw-btn{padding:4px 9px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:9px;color:var(--txt2);cursor:pointer;transition:all .2s;white-space:nowrap;font-weight:500;flex-shrink:0;}
.pw-btn:hover{border-color:var(--border2);}
.pw-btn.active-pw{background:#fff8ee;border-color:var(--sun-amber);color:var(--sun-orange);font-weight:700;}

/* WORDS GRID */
.words-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
@media(max-width:480px){.words-grid{grid-template-columns:repeat(4,1fr);}}
.word-cell{border-radius:8px;padding:7px 5px;border:1px solid var(--border);background:#fff;transition:all .2s;position:relative;overflow:hidden;cursor:default;}
.word-cell.is-active{background:#fff8ee;border-color:var(--sun-amber);box-shadow:0 0 0 2px rgba(232,136,26,0.12);cursor:pointer;}
.word-cell.has-data{cursor:pointer;}.word-cell.has-data:hover{background:var(--surface2);}
.word-cell.locked{opacity:.4;}
.wc-col-bar{height:2px;border-radius:1px;margin-bottom:4px;}
.wc-label{font-size:7px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--txt3);margin-bottom:3px;}
.word-cell.is-active .wc-label{color:var(--sun-orange);}
.wc-word{font-size:8.5px;font-weight:600;color:var(--txt);line-height:1.3;margin-bottom:4px;min-height:20px;}
.wc-bar-wrap{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:2px;}
.wc-bar{height:100%;border-radius:2px;transition:width .4s ease;}
.wc-pct{font-size:7.5px;color:var(--txt3);}
.word-cell.is-active .wc-pct{color:var(--sun-orange);font-weight:600;}
.wc-star{position:absolute;top:3px;right:4px;font-size:8px;color:var(--sun-amber);}
.wc-prio{position:absolute;top:3px;right:4px;font-size:9px;}

/* NOTION BTN */
.notion-btn{width:100%;padding:9px 14px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);color:var(--txt2);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:5px;margin-top:8px;}
.notion-btn:hover{border-color:var(--border2);color:var(--txt);}
.notion-btn-ok{border-color:var(--green)!important;color:var(--green)!important;background:#f0fff4!important;}

/* CAL */
.cal-panel{display:flex;flex-direction:column;gap:5px;margin-top:8px;}
.cal-hdr{font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);margin-bottom:4px;font-weight:700;}
.cal-empty,.cal-loading{text-align:center;padding:12px;color:var(--txt3);font-size:11px;}

/* MAESTRÍA */
.cycle-tabs{display:flex;gap:4px;margin-bottom:9px;flex-wrap:wrap;}
.cycle-tab{padding:4px 11px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:9px;font-weight:700;color:var(--txt3);cursor:pointer;transition:all .2s;}
.cycle-tab:hover{border-color:var(--border2);}
.cycle-tab.active-ct{background:#fffbee;border-color:#c8a000;color:#8a6000;}
.mt-wrap{overflow-x:auto;}
.mt-table{width:100%;border-collapse:separate;border-spacing:2px;}
.mt-ch{padding:4px 2px;text-align:center;font-size:7px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border-radius:4px;}
.mt-rh{padding:3px 7px;}
.mt-rnum{font-size:7px;color:var(--txt3);letter-spacing:1px;font-weight:600;}
.mt-rname{font-size:8px;color:var(--txt);font-weight:600;line-height:1.3;}
.mt-cell{padding:4px 3px;text-align:center;border-radius:5px;cursor:pointer;border:1px solid transparent;}
.mt-cell:hover{filter:brightness(.96);}
.mt-cell.mt-act{border-color:var(--sun-amber)!important;}
.mt-cword{font-size:7.5px;font-weight:600;color:var(--txt);line-height:1.2;margin-bottom:2px;}
.mt-cbar{height:2px;background:var(--border);border-radius:1px;overflow:hidden;margin-bottom:1px;}
.mt-cfill{height:100%;border-radius:1px;}
.mt-cpct{font-size:6.5px;color:var(--txt3);font-weight:500;}
.mt-act .mt-cpct{color:var(--sun-orange);font-weight:700;}
.mt-hcell{padding:4px 3px;text-align:center;border-radius:5px;background:#fffbee;border:1px solid rgba(200,160,0,0.2);}
.mt-hcell.leader{border-color:rgba(200,160,0,0.5);}
.mt-hword{font-size:7.5px;font-weight:600;color:#a08000;line-height:1.2;margin-bottom:1px;}
.mt-hcell.leader .mt-hword{color:#7a5800;}
.mt-hpct{font-size:6.5px;color:#c0a020;font-weight:600;}
.mt-htag{font-size:6.5px;color:#c0a020;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.mt-mcell{padding:4px 3px;text-align:center;border-radius:5px;background:#fffbee;border:1px solid rgba(200,160,0,0.15);cursor:pointer;}
.mt-mcell.won{border-color:rgba(200,160,0,0.4);}
.mt-mword{font-size:7.5px;font-weight:700;color:#a08000;}
.mt-mcell.won .mt-mword{color:#7a5800;}
.mt-h1{background:linear-gradient(135deg,#fffbee,#fff8d0)!important;border:2px solid rgba(200,160,0,0.5)!important;}
.mt-h1-king{font-size:14px;display:block;text-align:center;margin-bottom:2px;}
.mt-h1-word{font-size:7.5px;font-weight:700;color:#7a5800;}
.mt-h1-tag{font-size:6.5px;color:#c0a020;font-weight:600;}
.avg-section{margin-top:4px;}
.avg-section-title{font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:var(--txt3);margin-bottom:8px;font-weight:600;}
.avg-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
@media(min-width:600px){.avg-grid{grid-template-columns:repeat(3,1fr);}}
.avg-dim-block{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;}
.avg-dim-title{font-size:8.5px;font-weight:700;color:var(--acc);letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;}
.avg-word-row{display:flex;align-items:center;gap:5px;margin-bottom:4px;}
.avg-word-name{font-size:8.5px;color:var(--txt2);min-width:78px;flex-shrink:0;font-weight:500;}
.avg-word-bar-wrap{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.avg-word-bar{height:100%;border-radius:2px;transition:width .6s ease;}
.avg-word-pct{font-size:8px;font-weight:700;min-width:26px;text-align:right;}
.history-wrap{overflow-x:auto;}
.ht{width:100%;border-collapse:separate;border-spacing:2px;font-size:9px;}
.ht th{padding:5px 7px;background:var(--surface2);border-radius:4px;color:var(--txt3);font-weight:700;letter-spacing:1px;text-align:left;}
.ht td{padding:5px 7px;background:#fff;border-radius:4px;color:var(--txt2);border:1px solid var(--border);}

/* MODAL CAROUSEL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(42,31,14,0.6);backdrop-filter:blur(8px);z-index:9999;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--surface);border:2px solid var(--sun-amber);border-radius:22px;padding:26px 22px;width:340px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 48px rgba(0,0,0,0.15);}
.m-dim{font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);margin-bottom:5px;font-weight:700;}
.m-word{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--txt);line-height:1.1;margin-bottom:3px;}
.m-ctx{font-size:9.5px;color:var(--txt3);margin-bottom:14px;font-weight:500;}

/* Scale buttons */
.q-scale-btn{flex:1;height:50px;border-radius:9px;border:2px solid var(--border);background:var(--surface2);font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--txt3);}
.q-scale-btn:hover{border-color:var(--border2);color:var(--txt);}
.q-scale-btn.sel-1{border-color:#b02010;background:#fff5f5;color:#b02010;}
.q-scale-btn.sel-2{border-color:#c06010;background:#fff8f0;color:#c06010;}
.q-scale-btn.sel-3{border-color:#c08000;background:#fffbee;color:#c08000;}
.q-scale-btn.sel-4{border-color:#207040;background:#f0fff4;color:#207040;}
.q-scale-btn.sel-5{border-color:#1a7028;background:#e8fff0;color:#1a7028;}

.m-result-row{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 0 4px;border-top:2px solid var(--border);margin-top:8px;}
.m-result-pct{font-size:40px;font-weight:700;color:var(--sun-orange);line-height:1;font-family:'Playfair Display',serif;}
.m-result-pct small{font-size:18px;font-family:'DM Sans',sans-serif;font-weight:400;opacity:.6;}
.m-result-label{font-size:11px;color:var(--txt3);font-weight:600;}
.m-btns{display:flex;gap:8px;margin-top:18px;}
.btn-save{flex:2;padding:14px;border:2px solid var(--sun-amber);border-radius:11px;background:#fff8ee;color:var(--sun-orange);font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.btn-save:hover{background:var(--sun-orange);color:#fff;}
.btn-cancel{flex:1;padding:14px;border:2px solid var(--border);border-radius:11px;background:transparent;color:var(--txt3);cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;}
.btn-cancel:hover{border-color:var(--border2);color:var(--txt);}

/* SIGNATURE + SYNC */
.signature{position:fixed;bottom:20px;right:20px;z-index:50;font-family:'Dancing Script',cursive;font-size:20px;color:var(--sun-amber);opacity:.55;pointer-events:none;}
.sync-status{position:fixed;bottom:52px;right:20px;z-index:49;font-size:9.5px;font-weight:600;color:var(--txt3);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 10px;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.sync-syncing{color:var(--sun-amber);border-color:var(--sun-amber);}
.sync-ok{color:var(--green);border-color:var(--green);}
.sync-error{color:var(--red);border-color:var(--red);}
</style>

// ── WEEK MATH ──
function getISOWeek(d){const dt=new Date(d);dt.setHours(0,0,0,0);dt.setDate(dt.getDate()+3-(dt.getDay()+6)%7);const w1=new Date(dt.getFullYear(),0,4);return 1+Math.round(((dt-w1)/86400000-3+(w1.getDay()+6)%7)/7);}
function getMon(w,y){const s=new Date(y,0,1+(w-1)*7);const dow=s.getDay();const m=new Date(s);dow<=4?m.setDate(s.getDate()-dow+1):m.setDate(s.getDate()+8-dow);return m;}
function toRoman(n){const v=[50,40,10,9,5,4,1],s=['L','XL','X','IX','V','IV','I'];let r='';v.forEach((val,i)=>{while(n>=val){r+=s[i];n-=val;}});return r;}
function getSat(w){const m=getMon(w,2026);const s=new Date(m);s.setDate(m.getDate()+5);return s;}
function getWeekDays(w){const m=getMon(w,2026);const s=new Date(m);s.setDate(m.getDate()-1);const d=[s];for(let i=0;i<6;i++){const x=new Date(m);x.setDate(m.getDate()+i);d.push(x);}return d;}
function getViewCycle(w){return Math.ceil((w-1)/7);}
function getViewColIdx(w){return(w-1+6)%7;}

function getAnswers(week,di){
  const saved=ST['q_w'+week+'_d'+di];
  if(saved&&saved.length===5)return [...saved];
  return [null,null,null,null,null];
}
function saveAnswers(week,di,answers){
  ST['q_w'+week+'_d'+di]=answers;
  const total=answers.reduce(function(s,a){return s+(a||0);},0);
  const answered=answers.filter(function(a){return a!==null;}).length;
  const pct=answered>0?Math.round((total/25)*100):0;
  setPct(week,di,pct);
}

// ── PRIORITY WEIGHTING ──
function getPrio(week){return ST['prio_w'+week]||[];}
function isPriorityDim(week,di){
  const colIdx=getViewColIdx(week);
  const dim=DIMS.filter(function(d){return !d.isMaestria;})[di];
  if(!dim)return false;
  const word=dim.words[colIdx];
  return getPrio(week).includes(word);
}
function getPriorityMultiplier(pct){
  if(pct<70)return 0.9;
  if(pct>=80)return 1.1;
  return 1.0;
}
function getAdjustedPct(week,di){
  const pct=getPct(week,di);
  if(!isPriorityDim(week,di))return pct;
  return Math.min(100,Math.round(pct*getPriorityMultiplier(pct)));
}

// ── MAESTRIA (using adjusted pct for priority dims) ──
function getMaestria(week){
  let best=-1,bi=-1;
  DIMS.forEach(function(d,i){
    if(d.isMaestria)return;
    const p=getAdjustedPct(week,i);
    if(p>best){best=p;bi=i;}
  });
  return best>0?{pct:best,dimIdx:bi}:null;
}
function getBrillante(cn){
  const cs=2+(cn-1)*7;const ce=cs+6;let bA=-1,bi=-1;
  DIMS.forEach(function(d,i){
    if(d.isMaestria)return;
    let s=0,c=0;
    for(let w=cs;w<=ce;w++){const p=getPct(w,i);if(p>0){s+=p;c++;}}
    const a=c>0?s/c:0;if(a>bA){bA=a;bi=i;}
  });
  return bi>=0&&bA>0?{avg:Math.round(bA),dimIdx:bi}:null;
}
function getWordAvg(di,ci,upTo){
  let s=0,c=0;
  for(let cy=1;cy<=upTo;cy++){const w=2+(cy-1)*7+ci;const p=getPct(w,di);if(p>0){s+=p;c++;}}
  return c>0?Math.round(s/c):0;
}

function showToast(msg,dur){
  dur=dur||4000;let t=document.getElementById('toastMsg');
  if(!t){t=document.createElement('div');t.id='toastMsg';t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#2a1a08;color:#f0e8d0;padding:10px 18px;border-radius:20px;font-size:12px;font-weight:600;z-index:9998;box-shadow:0 4px 16px rgba(0,0,0,0.25);white-space:nowrap;max-width:90vw;text-align:center;';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(function(){t.style.opacity='0';},dur);

async function requestNotifications(){
  if(!('Notification' in window)){showToast('Notificaciones no disponibles');return false;}
  if(Notification.permission==='granted')return true;
  if(Notification.permission==='denied'){showToast('Actívalas en Ajustes del navegador');return false;}
  return (await Notification.requestPermission())==='granted';
}
function scheduleNextNotifications(){
  if(getStr('notif_enabled')!=='1'||Notification.permission!=='granted')return;
  const now=new Date();
  const mt=(getStr('notif_morning')||'07:30').split(':').map(Number);
  const morning=new Date(now);morning.setHours(mt[0],mt[1],0,0);
  if(morning<=now)morning.setDate(morning.getDate()+1);
  setTimeout(function(){
    const day=new Date().getDay();
    const dl=['','Lunes','Martes','Miércoles','Jueves','Viernes'];
    const al=['','@Regalo','@Pensamiento','@Desafío','@Consejo','@Frase'];
    if(day>=1&&day<=5)new Notification('🌅 SUNSET — Buenos días',{body:dl[day]+' · '+al[day]+' + 5 preguntas',tag:'sunset-morning'});
    else if(day===0)new Notification('🌅 SUNSET — Domingo',{body:'Elige tus 3 palabras prioritarias y prepara los @',tag:'sunset-sunday'});
    else if(day===6)new Notification('✅ SUNSET — Evaluación',{body:'Confirma tu Maestría y cierra la semana',tag:'sunset-saturday'});
    scheduleNextNotifications();
  },morning-now);
  const et=(getStr('notif_evening')||'20:00').split(':').map(Number);
  const evening=new Date(now);evening.setHours(et[0],et[1],0,0);
  if(evening<=now)evening.setDate(evening.getDate()+1);
  setTimeout(function(){
    if(new Date().getDay()>=1&&new Date().getDay()<=5)new Notification('🌅 SUNSET — Cierre',{body:'¿Completaste tus 5 preguntas? No olvides tu nota.',tag:'sunset-evening'});
  },evening-now);
}
async function handleNotifBtn(){
  if(getStr('notif_enabled')==='1'){setStr('notif_enabled','0');updateNotifBtn();showToast('🔕 Notificaciones desactivadas');}
  else{const ok=await requestNotifications();if(ok){setStr('notif_enabled','1');scheduleNextNotifications();updateNotifBtn();showToast('✅ Notificaciones activadas');}}
}
function updateNotifBtn(){
  const btn=document.getElementById('notifBtn');if(!btn)return;

  btn.innerHTML=on?'🔔 Activas':'🔕 Notificaciones';

  const day=TODAY.getDay();

      label.textContent=dayAt.emoji+' '+dayAt.label;

      content.className='ib-chips';

  const content=openPanel('✅ Evaluación Semanal','SEM. '+isoWeek+' · '+sat.getDate()+' '+MOA[sat.getMonth()]+' · CICLO '+toRoman(vCycle));

  navToggle.innerHTML='<span>📅 Semana '+isoWeek+' · '+COLS[getViewColIdx(isoWeek)].name+'</span><span id="satNavArrow">▼</span>';
  const navScroll=document.createElement('div');navScroll.className='sat-nav-scroll';navScroll.style.display='none';
  let navOpen=false;
  navToggle.addEventListener('click',function(){
    navOpen=!navOpen;navScroll.style.display=navOpen?'flex':'none';

  });

    const confirmed=ST['maestria_confirmed_w'+w];

    btn.style.flexShrink='0';

  // Maestría
  const b1=mkBlock('👑 Maestría de la Semana');

  } else if(m){
    const mc=document.createElement('div');mc.className='maestria-winner-card';
    mc.innerHTML='<div class="mw-crown">👑</div><div><div class="mw-word">'+(maestriaWord||DIMS[m.dimIdx].name)+'</div><div class="mw-dim">'+DIMS[m.dimIdx].name+' · '+m.pct+'%</div></div>';b1.appendChild(mc);
    const cbtn=document.createElement('button');cbtn.className='confirm-btn';cbtn.textContent='Confirmar Maestría';
    cbtn.addEventListener('click',function(){ST['maestria_confirmed_w'+isoWeek]=maestriaWord||DIMS[m.dimIdx].name;save();renderInfoBand();openSaturday(isoWeek);});
    b1.appendChild(cbtn);
  } else {
    b1.innerHTML+='<div style="color:var(--txt3);font-size:12px;padding:8px 0">Sin porcentajes registrados. Registra desde las dimensiones.</div>';
  }
  sec.appendChild(b1);

  // Scores with priority indicator
  const b2=mkBlock('📈 Resultados de la Semana');
  const sg=document.createElement('div');sg.className='score-grid';
  DIMS.filter(function(d){return !d.isMaestria;}).forEach(function(dim,di){
    const pct=getPct(isoWeek,di);
    const adj=getAdjustedPct(isoWeek,di);
    const isPrio=isPriorityDim(isoWeek,di);
    const color=pct>=70?'var(--green)':pct>=40?'var(--sun-orange)':'var(--txt3)';
    const card=document.createElement('div');card.className='score-card';
    card.style.cursor='pointer';
    card.innerHTML='<div class="score-name">'+(isPrio?'★ ':'')+dim.name+'</div><div class="score-val" style="color:'+color+'">'+(pct>0?pct+'%':'—')+'</div>'+(isPrio&&adj!==pct?'<div style="font-size:9px;color:'+(adj>pct?'var(--green)':'var(--red)')+'">→ '+adj+'%</div>':'');
    card.addEventListener('click',function(ddi){return function(){
      activeDim=ddi;renderDims();renderDetail();
    };}(di));
    sg.appendChild(card);
  });
  b2.appendChild(sg);sec.appendChild(b2);

  const b3=mkBlock('📝 Notas de Evaluación');
  b3.appendChild(mkTA('¿Qué funcionó? ¿Qué mejorar?','eval_w'+isoWeek,4));sec.appendChild(b3);
  if(!isPast){const b4=mkBlock('🎯 Intención Próximo Ciclo');b4.appendChild(mkTA('¿Qué quiero lograr en el Ciclo '+toRoman(vCycle+1)+'?','next_w'+isoWeek,2));sec.appendChild(b4);}

  // Notion btn
  const notionBtn=document.createElement('button');notionBtn.className='notion-btn';
  notionBtn.innerHTML='☁️ Guardar evaluación en Notion';
  notionBtn.addEventListener('click',function(){
    const scores=DIMS.filter(function(d){return !d.isMaestria;}).map(function(_,di){return getPct(isoWeek,di);});
    const maestria=ST['maestria_confirmed_w'+isoWeek]||'';
    const notas=getStr('eval_w'+isoWeek);
    syncEvalToNotion(isoWeek,scores,maestria,notas);
    notionBtn.className='notion-btn notion-btn-ok';notionBtn.innerHTML='✅ Evaluación guardada';
  });

  // Calendar
  const calDiv=document.createElement('div');sec.appendChild(calDiv);
  loadCal(sat,6,calDiv);

  content.appendChild(sec);

function buildWordsGrid(dim,di){
  const grid=document.createElement('div');grid.className='words-grid';
  const vCycle=getViewCycle(viewingWeek);
  const cs=2+(vCycle-1)*7;
  COLS.forEach(function(col,ci){
    const week=cs+ci;const pct=getPct(week,di);

    const isPrio=isPriorityDim(week,di);
    const cell=document.createElement('div');
    cell.className='word-cell'+(isAct?' is-active':hasData?' has-data':' locked');
    cell.innerHTML='<div class="wc-col-bar" style="background:'+col.clr+'"></div>'
      +'<div class="wc-label">'+col.emoji+' '+col.name+(isPrio?' ★':'')+'</div>'
      +'<div class="wc-word">'+dim.words[ci]+'</div>'
      +'<div class="wc-bar-wrap"><div class="wc-bar" style="width:'+pct+'%;background:'+col.bar+'"></div></div>'
      +'<div class="wc-pct">'+(pct>0?pct+'%':'—')+'</div>';

// ── CAROUSEL MODAL ──
let modalCtx=null;let carouselIdx=0;
const mOverlay=document.getElementById('modalOverlay');

function openQuestions(week,di,dim,ci){
  modalCtx={week,di,dim,ci};carouselIdx=0;
  renderCarousel();mOverlay.classList.add('open');
}

function renderCarousel(){
  if(!modalCtx)return;
  const {week,di,dim,ci}=modalCtx;
  const word=dim.words[ci];
  const questions=WORD_QUESTIONS[word]||[];
  const answers=getAnswers(week,di);
  const isPrio=isPriorityDim(week,di);

  document.getElementById('mDim').textContent='FILA '+dim.num+' · '+dim.name;
  document.getElementById('mWord').innerHTML=word+(isPrio?' <span style="color:var(--sun-amber)">★ Prioritaria</span>':'');
  document.getElementById('mCtx').textContent=COLS[ci].emoji+' '+COLS[ci].name+' · Semana '+week+' · Ciclo '+toRoman(getViewCycle(week));

  const qc=document.getElementById('mQuestions');qc.innerHTML='';
  const q=questions[carouselIdx];
  const cur=answers[carouselIdx];

  // Progress dots
  const prog=document.createElement('div');prog.style.cssText='display:flex;align-items:center;gap:7px;margin-bottom:14px;';
  const dots=document.createElement('div');dots.style.cssText='display:flex;gap:4px;flex:1;';
  for(let i=0;i<5;i++){
    const dot=document.createElement('div');
    dot.style.cssText='flex:1;height:4px;border-radius:2px;background:'+(i<carouselIdx?'var(--sun-orange)':i===carouselIdx?'var(--sun-amber)':'var(--border)')+';';
    dots.appendChild(dot);
  }
  const ctr=document.createElement('div');ctr.style.cssText='font-size:10px;font-weight:700;color:var(--txt3);white-space:nowrap;';
  ctr.textContent=(carouselIdx+1)+' / 5';
  prog.appendChild(dots);prog.appendChild(ctr);qc.appendChild(prog);

  // Question
  const qt=document.createElement('div');
  qt.style.cssText='font-size:15px;color:var(--txt);line-height:1.65;font-weight:700;min-height:70px;margin-bottom:20px;text-align:center;padding:0 2px;';
  qt.textContent=q;qc.appendChild(qt);

  // Scale 1-5
  const sw=document.createElement('div');sw.style.cssText='display:flex;gap:7px;margin-bottom:7px;';
  const scCls=['sel-1','sel-2','sel-3','sel-4','sel-5'];
  const scEm=['😞','😐','🙂','😊','⭐'];
  for(let v=1;v<=5;v++){
    const btn=document.createElement('button');
    btn.className='q-scale-btn'+(cur===v?' '+scCls[v-1]:'');
    btn.innerHTML=scEm[v-1]+'<span style="font-size:11px;font-weight:700;display:block">'+v+'</span>';
    btn.addEventListener('click',function(vv){return function(){
      const a=getAnswers(modalCtx.week,modalCtx.di);
      a[carouselIdx]=vv;saveAnswers(modalCtx.week,modalCtx.di,a);
      if(carouselIdx<4){carouselIdx++;renderCarousel();}
      else{renderCarouselResult();}
    };}(v));
    sw.appendChild(btn);
  }
  qc.appendChild(sw);

  const lbl=document.createElement('div');
  lbl.style.cssText='display:flex;justify-content:space-between;font-size:8.5px;color:var(--txt3);margin-bottom:14px;';
  lbl.innerHTML='<span>Nunca</span><span>Siempre</span>';qc.appendChild(lbl);

  // Nav buttons
  const nav=document.createElement('div');nav.style.cssText='display:flex;gap:7px;';
  if(carouselIdx>0){
    const back=document.createElement('button');
    back.style.cssText='flex:1;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--txt2);font-size:12px;font-weight:600;cursor:pointer;';
    back.textContent='← Anterior';
    back.addEventListener('click',function(){carouselIdx--;renderCarousel();});
    nav.appendChild(back);
  }
  if(cur!==null&&cur!==undefined){
    const next=document.createElement('button');
    next.style.cssText='flex:2;padding:10px;border:none;border-radius:10px;background:var(--sun-orange);color:#fff;font-size:12px;font-weight:700;cursor:pointer;';
    next.textContent=carouselIdx<4?'Siguiente →':'Ver resultado';
    next.addEventListener('click',function(){if(carouselIdx<4){carouselIdx++;renderCarousel();}else{renderCarouselResult();}});
    nav.appendChild(next);
  }
  if(nav.children.length)qc.appendChild(nav);
  updateResultRow(week,di);
}

function renderCarouselResult(){
  if(!modalCtx)return;
  const {week,di,dim,ci}=modalCtx;
  const answers=getAnswers(week,di);
  const total=answers.reduce(function(s,a){return s+(a||0);},0);
  const pct=Math.round((total/25)*100);
  const isPrio=isPriorityDim(week,di);
  const mult=isPrio?getPriorityMultiplier(pct):1.0;
  const adjPct=Math.min(100,Math.round(pct*mult));

  const qc=document.getElementById('mQuestions');qc.innerHTML='';
  const wrap=document.createElement('div');wrap.style.cssText='text-align:center;padding:8px 0;';

  const big=document.createElement('div');
  big.style.cssText='font-size:54px;font-weight:700;color:var(--sun-orange);line-height:1;font-family:"Playfair Display",serif;';
  big.textContent=pct+'%';wrap.appendChild(big);

  if(isPrio&&mult!==1.0){
    const adj=document.createElement('div');
    adj.style.cssText='font-size:12px;color:'+(mult>1?'var(--green)':'var(--red)')+';font-weight:700;margin-top:5px;';
    adj.textContent=(mult>1?'★ Prioritaria +10% → ':'★ Prioritaria −10% → ')+adjPct+'% en Maestría';
    wrap.appendChild(adj);
  }

  const sub=document.createElement('div');sub.style.cssText='font-size:11px;color:var(--txt3);margin-top:6px;';
  sub.textContent='Promedio '+(total/5).toFixed(1)+'/5 · '+answers.filter(function(a){return a!==null;}).length+' de 5 respondidas';
  wrap.appendChild(sub);

  // Answer recap chips
  const recap=document.createElement('div');recap.style.cssText='display:flex;gap:5px;justify-content:center;margin-top:12px;';
  const scCols=['#b02010','#c06010','#c08000','#207040','#1a7028'];
  answers.forEach(function(a,i){
    const chip=document.createElement('div');
    chip.style.cssText='padding:4px 10px;border-radius:20px;border:1px solid '+(a?scCols[a-1]:'var(--border)')+';font-size:11px;font-weight:700;color:'+(a?scCols[a-1]:'var(--txt3)')+';';
    chip.textContent='P'+(i+1)+': '+(a||'—');
    recap.appendChild(chip);
  });
  wrap.appendChild(recap);

  // Edit button
  const edit=document.createElement('button');
  edit.style.cssText='margin-top:14px;padding:9px 20px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--txt2);font-size:12px;font-weight:600;cursor:pointer;';
  edit.textContent='✏️ Editar respuestas';
  edit.addEventListener('click',function(){carouselIdx=0;renderCarousel();});
  wrap.appendChild(edit);
  // Auto-sync to Notion on result
  const wdays=getWeekDays(week);
  const dayOfWeek=TODAY.getDay();
  const noteDate=dayOfWeek>=1&&dayOfWeek<=5?wdays[dayOfWeek]:wdays[1];
  const noteKey=noteDate.getFullYear()+'-'+noteDate.getMonth()+'-'+noteDate.getDate();
  const note=getStr('dailynote_'+noteKey);
  syncDailyToNotion(week,di,dim,ci,answers,note,noteDate);

  qc.appendChild(wrap);
  updateResultRow(week,di);
}

function updateResultRow(week,di){
  const answers=getAnswers(week,di);
  const total=answers.reduce(function(s,a){return s+(a||0);},0);
  const answered=answers.filter(function(a){return a!==null;}).length;
  const pct=answered>0?Math.round((total/25)*100):0;
  const el=document.getElementById('mResultPct');if(el)el.innerHTML=pct+'<small>%</small>';
  const el2=document.getElementById('mResultLabel');if(el2)el2.textContent='Promedio '+(answered>0?(total/answered).toFixed(1):'-')+'/5 · '+answered+' de 5';
}

document.getElementById('btnCancel').onclick=function(){mOverlay.classList.remove('open');};

function buildMaestriaView(content){

    const tab=document.createElement('div');tab.className='cycle-tab'+(c===viewingCycle?' active-ct':'');

function buildWordAverages(content){
  const sec=document.createElement('div');sec.className='avg-section';
  const title=document.createElement('div');title.className='avg-section-title';
  title.textContent='Promedios acumulados · Ciclos I–'+toRoman(CYCLE_NOW);sec.appendChild(title);
  const grid=document.createElement('div');grid.className='avg-grid';
  DIMS.filter(function(d){return !d.isMaestria;}).forEach(function(dim,di){
    const block=document.createElement('div');block.className='avg-dim-block';
    const dt=document.createElement('div');dt.className='avg-dim-title';dt.textContent=dim.name;block.appendChild(dt);
    dim.words.map(function(word,ci){return {word,ci,avg:getWordAvg(di,ci,CYCLE_NOW)};})
      .sort(function(a,b){return b.avg-a.avg;})
      .forEach(function(item){
        const row=document.createElement('div');row.className='avg-word-row';
        const color=item.avg>=70?'var(--green)':item.avg>=40?'var(--sun-orange)':item.avg>0?'var(--red)':'var(--txt3)';
        row.innerHTML='<div class="avg-word-name">'+COLS[item.ci].emoji+' '+item.word+'</div>'
          +'<div class="avg-word-bar-wrap"><div class="avg-word-bar" style="width:'+item.avg+'%;background:'+COLS[item.ci].bar+'"></div></div>'
          +'<div class="avg-word-pct" style="color:'+color+'">'+(item.avg>0?item.avg+'%':'—')+'</div>';
        block.appendChild(row);
      });
    grid.appendChild(block);
  });
  sec.appendChild(grid);
  // Alerts
  const alerts=[];
  DIMS.filter(function(d){return !d.isMaestria;}).forEach(function(dim,di){
    dim.words.forEach(function(word,ci){const avg=getWordAvg(di,ci,CYCLE_NOW);if(avg>0&&avg<30)alerts.push({word,dim:dim.name,avg});});
  });
  if(alerts.length){
    const ab=document.createElement('div');
    ab.style.cssText='margin-top:10px;padding:10px 13px;background:#fff5f5;border:1px solid rgba(180,30,20,0.2);border-radius:9px;';
    ab.innerHTML='<div style="font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:var(--red);margin-bottom:6px;font-weight:700;">⚠️ Necesitan más atención</div>'
      +alerts.map(function(a){return '<div style="font-size:11px;color:var(--txt2);margin-bottom:3px;">• <strong style="color:var(--red)">'+a.word+'</strong> — '+a.dim+' · '+a.avg+'%</div>';}).join('');
    sec.appendChild(ab);
  }
  content.appendChild(sec);
}

    const week=cs+ci;const confirmed=ST['maestria_confirmed_w'+week];const m=getMaestria(week);
    const td=document.createElement('td');td.className='mt-mcell'+(confirmed||m?' won':'');
    td.innerHTML='<div class="mt-mword">'+(confirmed?'👑 '+confirmed:m?'👑…':'—')+'</div>';
    td.addEventListener('click',function(ww){return function(){viewingWeek=ww;renderHeader();renderWeekNav();openSaturday(ww);};}(week));
    mtr.appendChild(td);
  });
  const h1=document.createElement('td');h1.className='mt-mcell mt-h1';
  h1.innerHTML='<span class="mt-h1-king">♚</span><div class="mt-h1-word">'+(brill?DIMS[brill.dimIdx].name:'—')+'</div><div class="mt-h1-tag">'+(brill?brill.avg+'% BRILLANTE':isNow?'En curso':'—')+'</div>';
  mtr.appendChild(h1);tbody.appendChild(mtr);tbl.appendChild(tbody);wrap.appendChild(tbl);return wrap;
}

function buildHistoryTable(){
  const sec=document.createElement('div');sec.style.marginTop='11px';
  const lbl=document.createElement('div');lbl.style.cssText='font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--txt3);margin-bottom:6px;font-weight:700;';lbl.textContent='HISTORIAL 2026';sec.appendChild(lbl);
  const wrap=document.createElement('div');wrap.className='history-wrap';const tbl=document.createElement('table');tbl.className='ht';
  const hr=document.createElement('tr');['Ciclo','Sems','Color','Brillante','Estado'].forEach(function(h){const th=document.createElement('th');th.textContent=h;hr.appendChild(th);});tbl.appendChild(hr);
  for(let c=1;c<=7;c++){
    const cs=2+(c-1)*7;const ce=cs+6;const ci=getViewColIdx(cs);const brill=getBrillante(c);const isNow=c===CYCLE_NOW;
    const tr=document.createElement('tr');
    ['<strong style="color:var(--acc)">'+toRoman(c)+'</strong>',cs+'–'+ce,COLS[ci].emoji+' '+COLS[ci].name,brill?'✨ '+DIMS[brill.dimIdx].name+' ('+brill.avg+'%)':'—',isNow?'<span style="color:var(--sun-orange);font-weight:700">● Activo</span>':'<span style="color:var(--txt3)">○ Cerrado</span>']
      .forEach(function(v){const td=document.createElement('td');td.innerHTML=v;tr.appendChild(td);});
    tbl.appendChild(tr);
  }
  wrap.appendChild(tbl);sec.appendChild(wrap);return sec;
}

renderHeader();renderWeekNav();renderDays();renderDims();renderInfoBand();updateNotifBtn();
const td=TODAY.getDay();
if(td===0)setTimeout(function(){openSunday(ISO_NOW);},300);
else if(td===6)setTimeout(function(){openSaturday(ISO_NOW);},300);
else if(td>=1&&td<=5)setTimeout(function(){openDailyView(TODAY,td,ISO_NOW);},300);

</script>
